name: CUDA release gates

on:
  push:
    paths:
      - 'src/**'
      - 'gpu/**'
      - 'tests/run_cuda_release_gate.sh'
      - '.github/workflows/cuda.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'gpu/**'
      - 'tests/run_cuda_release_gate.sh'
      - '.github/workflows/cuda.yml'
  workflow_dispatch:

jobs:
  fp64-build:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.2.2-devel-ubuntu22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: apt-get update && apt-get install -y build-essential git python3
      - name: Build precise FP64 CUDA binary
        run: make -C gpu GPU_ARCH=70 GPU_PRECISION=double GPU_FAST_MATH=0 TARGET=bin/mbs_po_gpu_double -j2

  fp64-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run precise FP64 CPU/CUDA agreement gate
        run: make test_cuda
