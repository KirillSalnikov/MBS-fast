name: CPU release gates

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev
      - name: Strict warning gate
        run: make test_warnings MBS_BUILD_JOBS=2
      - name: Command-line release matrix
        run: make test_release
      - name: Numerical stability tests
        run: make test_so3 test_poles test_beam_topology test_forward_depth
